name: omnimem
version: 1.2.0
description: "OmniMem — 五层混合记忆系统：感知→工作→结构化→深层→内化，含治理引擎(冲突/衰减/遗忘/隐私/溯源)"
kind: backend
pip_dependencies:
  # 核心依赖（建议锁定主版本，避免 API Breaking Change）
  - "chromadb>=0.4.0,<0.8.0"
  - "rank-bm25>=0.2.0,<0.3.0"
  - "tiktoken>=0.7.0"
  - "pyyaml>=6.0"
  - "sentence-transformers>=2.2.0"
  - "jieba>=0.42.1"
  - "typing-extensions>=4.0.0"
  - "openai>=1.0.0"
  - "httpx>=0.24.0"
  # secret 级记忆加密（governance/encryption.py 缺失时显式报错，属硬依赖）
  - "cryptography>=42.0.0"
  # ★ M9-23: jieba 依赖 pkg_resources，setuptools>=81 移除后 jieba 导入即失败，钉版兜底
  - "setuptools<81"
requires_env: []
hooks:
  - on_session_end
  - on_pre_compress
  - on_memory_write
  - on_delegation
