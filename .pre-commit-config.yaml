repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: [--ignore-missing-imports]

  # ★ M9-22: 依赖单一来源校验（pyproject.toml ↔ requirements.txt ↔ plugin.yaml）
  - repo: local
    hooks:
      - id: dependency-sync
        name: dependency single-source check
        entry: python scripts/check_dependency_sync.py --quiet
        language: system
        files: ^(pyproject\.toml|requirements\.txt|plugin\.yaml)$
        pass_filenames: false
